[package]
name = "walldots"
version = "2.2.0"
edition = "2021"
description = "Transforme une image en grille de points type halftone, la taille suivant la luminosité et la couleur reprenant la teinte dominante locale."
license = "GPL-3.0-or-later"
repository = "https://github.com/RYU/WallDots-generator"
readme = "README.md"
keywords = ["halftone", "dots", "image", "wallpaper", "cli"]
categories = ["command-line-utilities", "multimedia::images"]

[[bin]]
name = "walldots"
path = "src/main.rs"

[dependencies]
image = "0.25"
tiny-skia = "0.11"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
ratatui = "0.29"

[profile.release]
lto = true
codegen-units = 1
strip = true

[package]
name = "walldots"
version = "3.3.0"
edition = "2021"
description = "Transforme une image en grille de points type halftone, la taille suivant la luminosité et la couleur reprenant la teinte dominante locale."
license = "GPL-3.0-or-later"
repository = "https://github.com/CantonyEddy/WallDots-Generator"
readme = "README.md"
keywords = ["halftone", "dots", "image", "wallpaper", "cli"]
categories = ["command-line-utilities", "multimedia::images"]

[[bin]]
name = "walldots"
path = "src/main.rs"

[dependencies]
image = "0.25"
tiny-skia = "0.11"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
ratatui = "0.30"
# default-features off pour NE PAS lier chafa (lib C) — on garde les protocoles
# pur-Rust (Kitty + demi-blocs de secours) via le backend crossterm.
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "image-defaults"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
